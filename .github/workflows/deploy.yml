name: Deploy

on:
  push:
    branches: [master]
  # A new activity on Strava can come in at any time of the day
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  # Sent by the Strava webhook, see netlify/functions/strava-webhook.mjs
  repository_dispatch:
    types: [strava-activity]

# Two builds at once would restore and save the same caches
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The first build, with no cache, downloads and processes every image
    timeout-minutes: 360
    env:
      NETLIFY_SITE_ID: 545297ff-8406-4213-860c-9db291fbfd9b
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # Read by the `.npmrc`, for the Font Awesome registry
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # What a build fetches or computes slowly. `.cache` and `public` go
      # together: Gatsby only reuses the first one if the second is there.
      # `content/google-docs` has to be there too, even though the Google
      # Docs plugin copies it back from `.google-docs`: Gatsby drops every
      # processed image whose source file is missing when it starts, before
      # any plugin runs, and processes all of them again. The key changes on
      # every run so that the caches are always saved again, the latest one
      # is the one restored.
      - name: Restore the caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .strava
            .google-docs
            content/google-docs
            .cache
            public
          key: gatsby-${{ github.run_id }}
          restore-keys: gatsby-

      - run: yarn install --frozen-lockfile

      # A build only fetches the activities started after the store's cursor:
      # an activity edited or deleted on strava.com needs the store updated
      # first. The daily build also syncs the whole store, in case an event
      # got lost.
      - name: Update the Strava store
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'repository_dispatch' &&
          github.event.client_payload.aspect_type != 'create')
        run: |
          if [ "$ASPECT_TYPE" = "update" ]; then
            yarn gatsby-source-strava-activity "$ACTIVITY_ID" --refresh
          else
            yarn sync-activities
          fi
        env:
          ASPECT_TYPE: ${{ github.event.client_payload.aspect_type }}
          ACTIVITY_ID: ${{ github.event.client_payload.object_id }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_TOKEN: ${{ secrets.STRAVA_TOKEN }}

      - name: Build
        run: yarn build
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_TOKEN: ${{ secrets.STRAVA_TOKEN }}
          # `GITHUB_` is a reserved prefix for secrets. It has to be a
          # personal token: the site reads the gists and the repositories of
          # its `viewer`.
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          GOOGLE_DOCS_FOLDER: ${{ secrets.GOOGLE_DOCS_FOLDER }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_DOCS_TOKEN: ${{ secrets.GOOGLE_DOCS_TOKEN }}
          GATSBY_MAPBOX_TOKEN: ${{ secrets.GATSBY_MAPBOX_TOKEN }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
          CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}

      # Even when the build fails: the first builds may need several tries
      # to get through every image, each one keeps what the last one did
      - name: Save the caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            .strava
            .google-docs
            content/google-docs
            .cache
            public
          key: gatsby-${{ github.run_id }}

      # The Strava webhook function is deployed along with the site
      - name: Deploy to Netlify
        run: yarn netlify deploy --prod --dir=public --functions=netlify/functions
